# Public workshop cohorts.
#
# Each entry renders one card in the "Public Workshops" section of /workshops.
# Cohorts whose start_date is in the past are hidden automatically — but only
# when the site is rebuilt, so past cohorts linger until the next push/deploy.
#
# logo: optional engine logo shown in the card header (e.g. assets/logo_unity.png).
#   Omit it and the card shows a text badge with the engine name instead.
#
# checkout_url: the Stripe Payment Link for this cohort (one link per cohort).
#   Leave it blank, or leave REPLACE_ME in it, and the card falls back to a
#   "get notified" button instead of a live checkout button.

